name: Deploy troute main

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # An SSH disconnect does not reliably stop a remote build. Finish the active
  # deployment, then deploy the latest main from the remaining pending run.
  group: troute-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out deployment script
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false

      - name: Connect over SSH and deploy main
        shell: bash
        env:
          TROUTE_DEPLOY_HOST: ${{ secrets.TROUTE_DEPLOY_HOST }}
          TROUTE_DEPLOY_USER: ${{ secrets.TROUTE_DEPLOY_USER }}
          TROUTE_DEPLOY_PORT: ${{ secrets.TROUTE_DEPLOY_PORT || vars.TROUTE_DEPLOY_PORT || '22' }}
          TROUTE_DEPLOY_PATH: ${{ secrets.TROUTE_DEPLOY_PATH || vars.TROUTE_DEPLOY_PATH }}
          TROUTE_DEPLOY_SSH_KEY: ${{ secrets.TROUTE_DEPLOY_SSH_KEY }}
          TROUTE_DEPLOY_KNOWN_HOSTS: ${{ secrets.TROUTE_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for name in TROUTE_DEPLOY_HOST TROUTE_DEPLOY_USER TROUTE_DEPLOY_PATH \
                      TROUTE_DEPLOY_SSH_KEY TROUTE_DEPLOY_KNOWN_HOSTS; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing configuration: $name"
              exit 1
            fi
          done
          if [[ ! "$TROUTE_DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]] || \
             (( 10#$TROUTE_DEPLOY_PORT < 1 || 10#$TROUTE_DEPLOY_PORT > 65535 )); then
            echo '::error::TROUTE_DEPLOY_PORT must be between 1 and 65535'
            exit 1
          fi

          umask 077
          ssh_dir=$(mktemp -d)
          trap 'rm -rf -- "$ssh_dir"' EXIT
          printf '%s\n' "$TROUTE_DEPLOY_SSH_KEY" > "$ssh_dir/key"
          printf '%s\n' "$TROUTE_DEPLOY_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          ssh-keygen -y -P '' -f "$ssh_dir/key" > /dev/null

          # SSH passes its remote command through a shell. Quote the configured
          # path as data, including paths containing spaces or apostrophes.
          remote_command=$(python3 -c 'import os, shlex; print("bash -s -- " + shlex.quote(os.environ["TROUTE_DEPLOY_PATH"]))')
          echo 'Connecting to deployment host over SSH'
          ssh -T \
            -i "$ssh_dir/key" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$ssh_dir/known_hosts" \
            -o ConnectTimeout=15 \
            -o ConnectionAttempts=1 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            -p "$TROUTE_DEPLOY_PORT" \
            -l "$TROUTE_DEPLOY_USER" \
            -- "$TROUTE_DEPLOY_HOST" "$remote_command" < scripts/deploy.sh
