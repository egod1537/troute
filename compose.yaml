services:
  troute:
    build: .
    restart: unless-stopped
    environment:
      - TROUTE_PORT=${TROUTE_PORT:-8080}
      - TROUTE_DATA_DIR=/data
      - TROUTE_MAX_CONCURRENT_JOBS
      - TCACHE_BASE_URL
      - TCACHE_POLL_INTERVAL_MS
      - TCACHE_REQUEST_TIMEOUT_MS
      - TCACHE_PAIR_CONCURRENCY
      - TCACHE_MATRIX_TOTAL_TIMEOUT_MS
      - TCACHE_MATRIX_POLL_INTERVAL_MS
      - TCACHE_MATRIX_TIMEOUT_MS
    volumes:
      - ./runtime/troute:/data
    ports:
      - "127.0.0.1:${TROUTE_HOST_PORT:-18080}:${TROUTE_PORT:-8080}"
  testbed:
    build:
      context: .
      dockerfile: testbed/Dockerfile
      args:
        VITE_TROUTE_API_BASE_URL: ${VITE_TROUTE_API_BASE_URL:-/api}
        VITE_TROUTE_ROUTE_PATH: ${VITE_TROUTE_ROUTE_PATH:-/optimize}
        VITE_TROUTE_COMMIT_SHA: ${TROUTE_COMMIT_SHA:-unknown}
    restart: unless-stopped
    environment:
      TROUTE_PORT: ${TROUTE_PORT:-8080}
    ports:
      - "127.0.0.1:${TROUTE_TESTBED_PORT:-8081}:8080"
    depends_on:
      - troute
