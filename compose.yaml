services:
  troute:
    build:
      context: .
      args:
        TROUTE_CARGO_FEATURES: ${TROUTE_CARGO_FEATURES:-}
    # Production must return after the Mac/Docker daemon restarts, even if the
    # container had been stopped before the reboot.
    restart: always
    environment:
      - TROUTE_PORT=${TROUTE_PORT:-8080}
      - TROUTE_DATA_DIR=/data
      - TROUTE_MAX_CONCURRENT_JOBS
      - TROUTE_MAX_OUTSTANDING_JOBS
      - TROUTE_MAX_CONCURRENT_MATRIX_PREVIEWS
      - TROUTE_MAX_ROUTING_PAIRS
      - TROUTE_REMEDIATION_BUDGET_MS=${TROUTE_REMEDIATION_BUDGET_MS:-500}
      - TROUTE_REMEDIATION_MAX_REMOVE_PROBES=${TROUTE_REMEDIATION_MAX_REMOVE_PROBES:-8}
      - TROUTE_MAX_FAILURE_SUGGESTIONS=${TROUTE_MAX_FAILURE_SUGGESTIONS:-3}
      - TCACHE_BASE_URL
      - TCACHE_POLL_INTERVAL_MS
      - TCACHE_REQUEST_TIMEOUT_MS
      - TCACHE_PAIR_CONCURRENCY
      - TCACHE_MATRIX_TOTAL_TIMEOUT_MS
      - TCACHE_MATRIX_POLL_INTERVAL_MS
      - TCACHE_MATRIX_TIMEOUT_MS
      - TROUTE_DEFAULT_EUCLIDEAN_MATRIX=${TROUTE_DEFAULT_EUCLIDEAN_MATRIX:-true}
      - ROUTE_PROVIDER=${ROUTE_PROVIDER:-auto}
      - ROUTE_PROVIDER_POLICY_JSON
      - ROUTE_PROVIDER_OVERRIDE_ENABLED=${ROUTE_PROVIDER_OVERRIDE_ENABLED:-false}
      - JAPAN_TRANSIT_PROVIDER
      - TROUTE_EXACT_LIMIT
      - TROUTE_MAX_EXACT_CLUSTER_SIZE
      - TROUTE_SOLVER_TOTAL_BUDGET_MS
      - SOLVER_MAX_CONCURRENCY
      - SOLVER_CPU_SLOTS
      - SOLVER_STRATEGY_TIMEOUT_MS
      - SOLVER_SA_CHUNK_MS
      - SOLVER_DEADLINE_SAFETY_MS
      - SOLVER_SA_SEEDS
      - SOLVER_ENABLE_MIP_SCIP=${SOLVER_ENABLE_MIP_SCIP:-false}
      - SOLVER_MIP_SCIP_TIMEOUT_MS
      - SOLVER_MIP_SCIP_THREADS
      - SOLVER_MIP_SCIP_MEMORY_MB
      - SOLVER_ENABLE_LKH3=${SOLVER_ENABLE_LKH3:-false}
      - LKH3_EXECUTABLE
      - SOLVER_LKH3_TIMEOUT_MS
      - SOLVER_LKH3_SEED
      - SOLVER_COMPARE_ALL
      - SOLVER_INCUMBENT_EXCHANGE=${SOLVER_INCUMBENT_EXCHANGE:-false}
      - SOLVER_PORTFOLIO_POLICY=${SOLVER_PORTFOLIO_POLICY:-CURRENT}
      - SOLVER_POLICY_SEED
      - SOLVER_POLICY_MIN_QUANTUM_MS
      - SOLVER_RACING_WARMUP_RUNS
      - SOLVER_UCB_EXPLORATION
      - SOLVER_MIN_EXPLORATION_RATIO
      - SOLVER_MAX_STARVATION_RUNS
      - SOLVER_POLICY_WEIGHTS_JSON
      - SOLVER_TELEMETRY_MODE=${SOLVER_TELEMETRY_MODE:-SUMMARY}
      - SOLVER_TELEMETRY_MAX_EVENTS
      - SOLVER_MAX_EXTERNAL_PROCESSES
      - SOLVER_MEMORY_LIMIT_MB
      - TROUTE_PORTFOLIO_EXPERIMENT_ENABLED=${TROUTE_PORTFOLIO_EXPERIMENT_ENABLED:-false}
    volumes:
      - ./runtime/troute:/data
    ports:
      - "127.0.0.1:${TROUTE_HOST_PORT:-18080}:${TROUTE_PORT:-8080}"
  testbed:
    build:
      context: .
      dockerfile: testbed/Dockerfile
      args:
        VITE_TROUTE_API_BASE_URL: ${VITE_TROUTE_API_BASE_URL:-/api}
        VITE_TROUTE_ROUTE_PATH: ${VITE_TROUTE_ROUTE_PATH:-/optimize}
        VITE_TROUTE_COMMIT_SHA: ${TROUTE_COMMIT_SHA:-unknown}
    restart: always
    environment:
      TROUTE_PORT: ${TROUTE_PORT:-8080}
    ports:
      - "127.0.0.1:${TROUTE_TESTBED_PORT:-8081}:8080"
    depends_on:
      - troute
