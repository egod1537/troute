<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#141a21" />
    <meta name="description" content="troute 요청, 경로, 실행 시간을 확인하는 개발자 테스트베드" />
    <link rel="icon" type="image/svg+xml" href="/troute-icon.svg?v=2" />
    <script>
      (() => {
        let mode = "system";
        try {
          const stored = localStorage.getItem("troute.testbed.theme");
          if (stored === "light" || stored === "dark" || stored === "system") {
            mode = stored;
          }
        } catch {
          // System mode remains available when browser storage is unavailable.
        }
        const prefersDark = matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme =
          mode === "dark" || (mode === "system" && prefersDark)
            ? "dark"
            : "light";
      })();
    </script>
    <title>troute · 테스트베드</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
